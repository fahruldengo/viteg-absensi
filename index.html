<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0d1250">
  <title>Absensi Karyawan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261117d">
</head>
<body>
  <main class="absen-wrap">
    <header class="absen-head">
      <img src="assets/logo.png" class="brand-logo" alt="VTEG" height="54" style="height:54px;width:auto">
      <div>
        <div class="eyebrow">Absensi Karyawan</div>
        <h1 id="instansi">Memuat…</h1>
      </div>
    </header>

    <div id="notice" class="notice hidden"></div>

    <section class="clock-card">
      <div class="clock" id="clock">--:--:--</div>
      <div class="date" id="date">—</div>
      <div class="shift">
        <span>Masuk <b id="jamMasuk">--:--</b></span>
        <span>Pulang <b id="jamPulang">--:--</b></span>
        <span>Toleransi <b id="toleransi">-</b></span>
      </div>
    </section>

    <section class="card">
      <label class="lbl" for="cari">Karyawan</label>
      <input id="cari" class="inp" placeholder="Cari nama atau ID…" autocomplete="off">
      <select id="karyawan" class="inp">
        <option value="">— Pilih nama Anda —</option>
      </select>

      <div id="statusBox" class="status-box hidden">
        <div><span>Masuk</span><b id="stMasuk">—</b></div>
        <div><span>Pulang</span><b id="stPulang">—</b></div>
        <div><span>Status</span><b id="stStatus">—</b></div>
      </div>

      <div id="lapSection" class="lap-section hidden">
        <label class="lbl">Laporan kerja hari ini <span id="lapReq" class="req"></span></label>
        <div class="lap-info" id="lapInfo">Tulis pekerjaan yang Anda kerjakan hari ini, lalu absen pulang.</div>
        <button type="button" class="btn btn-ghost btn-sm" id="btnBawaan" style="margin-bottom:10px">↻ Muat pekerjaan belum selesai</button>
        <div id="lapEditor"></div>
      </div>

      <label class="lbl">Foto Lokasi <span id="fotoReq" class="req"></span></label>
      <div class="cam" id="cam">
        <video id="video" playsinline muted autoplay class="hidden"></video>
        <img id="snap" class="hidden" alt="Foto lokasi">
        <div class="cam-empty" id="camEmpty">
          <button type="button" id="btnCam" class="btn btn-dark">Buka Kamera</button>
          <small id="camHint">Foto diambil langsung dari kamera, lengkap dengan waktu & koordinat.</small>
        </div>
      </div>
      <div class="cam-actions" id="camActions">
        <button type="button" id="btnFlip" class="btn btn-ghost btn-sm hidden">Ganti kamera</button>
        <button type="button" id="btnShot" class="btn btn-primary hidden">Ambil Foto</button>
        <button type="button" id="btnRetake" class="btn btn-ghost btn-sm hidden">Ulangi foto</button>
      </div>

      <div class="loc wait" id="loc"><span class="loc-dot"></span><span id="locText">Mendeteksi lokasi…</span></div>

      <label class="lbl" for="pin">PIN</label>
      <input id="pin" class="inp pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••" autocomplete="off">

      <div class="btn-row">
        <button id="btnMasuk" class="btn btn-primary btn-lg" disabled>Absen Masuk</button>
        <button id="btnPulang" class="btn btn-dark btn-lg" disabled>Absen Pulang</button>
      </div>
    </section>

    <footer class="absen-foot"><a href="saya.html">Performa Saya</a><span class="muted"> · </span><a href="admin.html">Panel Admin</a></footer>
  </main>

  <div id="result" class="overlay hidden">
    <div class="result-card">
      <div id="rIcon" class="result-icon ok">✓</div>
      <h2 id="rTitle">Berhasil</h2>
      <div id="rTime" class="result-time">--:--</div>
      <p id="rDesc"></p>
      <button id="rClose" class="btn btn-dark btn-lg">Selesai</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="config.js?v=20261117d"></script>
  <script src="api.js?v=20261117d"></script>
  <script src="absen.js?v=20261117d"></script>
</body>
</html>
