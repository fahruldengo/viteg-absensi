<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0d1250">
  <meta name="robots" content="noindex">
  <title>Performa Saya — Absensi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LOGIN -->
  <section id="login" class="login-wrap hidden">
    <form id="loginForm" class="card login-card">
      <img src="assets/logo.png" class="login-logo" alt="VTEG">
      <h1>Performa Saya</h1>
      <p class="muted" style="margin:0">Masuk dengan ID dan PIN absen Anda.</p>
      <div id="loginNotice" class="notice hidden" style="margin:14px 0 0"></div>
      <label class="lbl" for="lId">ID karyawan</label>
      <input id="lId" class="inp" autocomplete="username" autocapitalize="characters" required>
      <label class="lbl" for="lPin">PIN</label>
      <input id="lPin" class="inp pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••" autocomplete="current-password" required>
      <button class="btn btn-primary btn-lg" type="submit" id="btnLogin">Masuk</button>
      <p style="text-align:center;margin:16px 0 0;font-size:13px"><a href="index.html">← Halaman absen</a></p>
    </form>
  </section>

  <!-- APP -->
  <main id="app" class="saya-wrap hidden">
    <div class="brand-row"><img src="assets/logo.png" alt="VTEG"><span>Performa Saya</span></div>
    <header class="saya-head">
      <div class="saya-id">
        <div class="avatar" id="avatar">—</div>
        <div>
          <div class="eyebrow" id="instansi">Karyawan</div>
          <h1 id="nama">—</h1>
          <div class="muted" id="sub">—</div>
        </div>
      </div>
      <div class="saya-actions">
        <button class="btn btn-ghost btn-sm" id="btnPin">Ganti PIN</button>
        <button class="btn btn-ghost btn-sm" id="btnLogout">Keluar</button>
      </div>
    </header>

    <div class="month-nav">
      <button class="btn btn-ghost btn-sm" id="prev" aria-label="Bulan sebelumnya">‹</button>
      <b id="bulanLabel">—</b>
      <button class="btn btn-ghost btn-sm" id="next" aria-label="Bulan berikutnya">›</button>
    </div>

    <div id="content">
      <section class="score card">
        <div class="ring" id="ring"><span id="ringVal">–</span></div>
        <div>
          <div class="eyebrow">Ketepatan waktu</div>
          <div class="score-title" id="scoreTitle">—</div>
          <div class="muted" id="scoreSub">—</div>
        </div>
      </section>

      <div class="stats saya-stats" id="stats"></div>

      <section class="card block">
        <div class="block-head"><h2>Kalender</h2><span class="muted" id="kalInfo"></span></div>
        <div class="cal-head"><span>Sen</span><span>Sel</span><span>Rab</span><span>Kam</span><span>Jum</span><span>Sab</span><span>Min</span></div>
        <div class="cal" id="cal"></div>
        <div class="legend">
          <span><i class="lg-ok"></i>Tepat waktu</span><span><i class="lg-late"></i>Terlambat</span>
          <span><i class="lg-info"></i>Izin/Cuti/Dinas</span><span><i class="lg-warn"></i>Sakit</span><span><i class="lg-bad"></i>Alpa</span>
        </div>
      </section>

      <section class="card block">
        <div class="block-head"><h2>Tren 6 Bulan</h2></div>
        <div class="trend" id="trend"></div>
        <div class="legend">
          <span><i class="lg-ok"></i>Tepat waktu</span><span><i class="lg-late"></i>Terlambat</span><span><i class="lg-none"></i>Tidak hadir</span>
        </div>
      </section>

      <section class="block">
        <div class="block-head" style="padding:0 4px"><h2>Riwayat</h2><span class="muted" id="riwInfo"></span></div>
        <div id="riwayat" class="riwayat"></div>
      </section>
    </div>
  </main>

  <div id="modalWrap" class="overlay hidden"><div class="modal" id="modal"></div></div>
  <div id="toast" class="toast"></div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="saya.js"></script>
</body>
</html>
